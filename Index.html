<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ECHO-17 // ARCHIVE</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #000;
    color: #aaa;
    font-family: "Courier New", monospace;
    min-height: 100vh;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;

    background: repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.025) 0px,
        rgba(255,255,255,0.025) 1px,
        transparent 2px,
        transparent 4px
    );
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 998;

    background: rgba(255,255,255,0.015);
    animation: flicker 0.15s infinite;
}

@keyframes flicker {
    0% { opacity: .15; }
    50% { opacity: .03; }
    100% { opacity: .12; }
}

.container {
    width: 92%;
    max-width: 900px;
    margin: auto;
    padding: 25px
